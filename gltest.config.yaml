# gltest configuration for CrisisRelief.
#
# studionet is the default target: it is gasless, so a zero GEN balance is
# fine and no private keys are needed to run the integration suite.
#
#   gltest tests/ -v -s                          # studionet (default)
#   gltest tests/ -v -s --network localnet       # local GenLayer Studio
#   gltest tests/ -v -s --network testnet_asimov # needs ACCOUNT_PRIVATE_KEY_*

environment: .env

paths:
  contracts: contracts/
  artifacts: artifacts/

networks:
  default: studionet

  # studio.genlayer.com - gasless, funded through sim_fundAccount.
  # StudioNet rate limits to 30 RPC requests per minute, and each poll of a
  # pending transaction costs one. A 10s interval keeps polling at 6 per
  # minute, leaving headroom for the calls the tests make in between.
  studionet:
    leader_only: false
    default_wait_interval: 10000
    default_wait_retries: 90

  # GenLayer Studio running locally
  localnet:
    leader_only: false
    default_wait_interval: 2000
    default_wait_retries: 30
